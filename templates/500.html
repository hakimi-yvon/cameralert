{% extends 'base.html' %}

{% block titre %}Erreur serveur (500) — CamerAlert{% endblock %}

{% block contenu %}
<div class="container py-5">
    <div class="row justify-content-center text-center">
        <div class="col-md-7 col-lg-5">
            <div class="card shadow-sm p-5 border-0 animate-in" style="border-radius: 20px; background: var(--bg-card); border: 1px solid var(--border-color) !important;">
                <div class="p-3 bg-danger-subtle text-danger rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 72px; height: 72px;">
                    <span class="fs-1">⚠️</span>
                </div>
                <div class="badge bg-danger-subtle text-danger px-2.5 py-1 fw-bold mb-2" style="font-size:11px;">INCIDENT TECHNIQUE</div>
                <h1 class="h3 fw-bold mb-2 text-dark-emphasis">Une erreur est survenue</h1>
                <p class="text-muted small mb-4">
                    Notre équipe technique a été notifiée de l'incident et procède à la résolution immédiate du problème.
                </p>
                <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
                    <a href="{% url 'accueil' %}" class="btn btn-danger px-4 py-2.5 fw-bold shadow-sm" style="border-radius:12px;">
                        Retourner à l'accueil
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
