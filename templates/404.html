{% extends 'base.html' %}

{% block titre %}Page introuvable (404) — CamerAlert{% endblock %}

{% block contenu %}
<div class="container py-5">
    <div class="row justify-content-center text-center">
        <div class="col-md-7 col-lg-5">
            <div class="card shadow-sm p-5 border-0 animate-in" style="border-radius: 20px; background: var(--bg-card); border: 1px solid var(--border-color) !important;">
                <div class="p-3 bg-danger-subtle text-danger rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 72px; height: 72px;">
                    <span class="fs-1">🔍</span>
                </div>
                <div class="badge bg-danger-subtle text-danger px-2.5 py-1 fw-bold mb-2" style="font-size:11px;">ERREUR 404</div>
                <h1 class="h3 fw-bold mb-2 text-dark-emphasis">Page introuvable</h1>
                <p class="text-muted small mb-4">
                    La fiche de recherche ou la ressource demandée n'existe pas, a été supprimée ou déplacée.
                </p>
                <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
                    <a href="{% url 'accueil' %}" class="btn btn-danger px-4 py-2.5 fw-bold shadow-sm" style="border-radius:12px;">
                        Retour à l'accueil
                    </a>
                    <a href="{% url 'liste_cas' %}" class="btn btn-outline-secondary px-4 py-2.5 fw-bold" style="border-radius:12px;">
                        Avis de recherche
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
