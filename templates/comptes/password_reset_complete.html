{% extends 'base.html' %}
{% block titre %}Mot de passe réinitialisé — CamerAlert{% endblock %}

{% block contenu %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5 col-xl-4">
            <div class="form-card animate-in border-0 shadow-sm text-center" style="border-radius: 20px; background: var(--bg-card); border: 1px solid var(--border-color) !important; padding: 36px 28px;">
                <div class="p-3 bg-success-subtle text-success rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 56px; height: 56px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/>
                    </svg>
                </div>
                <div class="badge bg-success-subtle text-success px-2.5 py-1 fw-bold mb-2" style="font-size:11px;">SUCCÈS</div>
                <h2 class="h4 fw-bold mb-2">Mot de passe réinitialisé !</h2>
                <p class="text-muted small mb-4">
                    Votre mot de passe a été mis à jour en toute sécurité. Vous pouvez dès à présent vous identifier.
                </p>
                <a href="{% url 'connexion' %}" class="btn btn-danger w-100 py-2.5 fw-bold shadow-sm" style="border-radius:12px;">
                    Se connecter à présent
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
