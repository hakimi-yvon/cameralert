{% extends 'base.html' %}
{% block titre %}Connexion — CamerAlert{% endblock %}

{% block contenu %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="form-card text-center animate-in">
                <div class="auth-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" class="bi bi-person-fill" viewBox="0 0 16 16">
                      <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3Zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>
                    </svg>
                </div>
                <h4 class="fw-semibold mb-1">Bon retour !</h4>
                <p class="text-muted small mb-4">
                    Connectez-vous pour gérer vos signalements.
                </p>
                <form method="POST" class="text-start">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label">{{ field.label }}</label>
                            {{ field }}
                        </div>
                    {% endfor %}
                    <div class="d-flex justify-content-end mb-3">
                        <a href="{% url 'password_reset' %}" class="small text-muted text-decoration-none">
                            Mot de passe oublié ?
                        </a>
                    </div>
                    <button class="btn btn-danger w-100 mt-2 py-2 fw-semibold">
                        Se connecter
                    </button>
                </form>
                <div class="mt-4 small text-muted">
                    Pas encore de compte ?
                    <a href="{% url 'inscription' %}" class="text-danger fw-medium text-decoration-none">
                        S'inscrire
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
